[package]
name = "feetech-servo-sdk"
version = "0.3.0"
edition = "2024"
description = "High-performance async Rust driver for Feetech STS/SMS servos."
authors = ["Leon <leon@leonrust.com>"]
license = "MIT"
repository = "https://github.com/DoraCN/feetech-servo-sdk"

[features]
default = ["tokio-serial-impl"]
tokio-serial-impl = ["dep:tokio-serial"]
mock = []

[dependencies]
# 异步运行时与串口
tokio = { version = "1", features = ["full"] }
tokio-serial = { version = "5.4", optional = true }

# 错误处理与日志
thiserror = "2.0.18"
tracing = "0.1"      # 标准日志门面

# 工具类
bytes = "1"    # 高效字节操作
crc = "3"      # 如果未来需要高级校验
bitflags = "2" # 处理硬件状态位

# CLI 工具依赖 (可选，仅用于 examples)
clap = { version = "4", features = ["derive"] }
async-trait = "0.1.89"
anyhow = "1.0"
tracing-subscriber = "0.3.22"

[dev-dependencies]
anyhow = "1.0"     # 测试用简便错误处理
crossterm = "0.27" # 新增依赖：用于键盘控制
